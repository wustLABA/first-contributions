# LABA First Contribution —— 通过 Issue 自助申请加入 wustLABA Organization 与 LABA-Members Team
#
# 目标流程：
#   Issue Form 提交 → 本 workflow 触发 → 从事件上下文取申请人 login
#   → 调用 GitHub REST API 邀请加入 Organization → 加入 LABA-Members Team
#   → 评论结果 → 打 label → 关闭 Issue
#
# 权限来源（重要）：
#   用户的仓库写权限**不来自**本仓库的协作者授权，而是来自
#   wustLABA Organization → LABA-Members Team → Repository permissions: Write。
#   好处：今后新增项目只需在 Team 上勾选仓库，无需改动本 workflow。
#
# ─── 安全设计说明（为什么这么写） ──────────────────────────────────────────────
#
# 1. 【识别严格化】只有「Issue Form 提交的 LABA 权限申请」才触发授权，普通 Issue 一律忽略。
#    job 级先过滤 title 前缀 [LABA Access]，再由 validate 步骤校验 body 必须含表单固定结构。
#    label laba-access 作为额外的识别信号，由 laba-sync-issue-labels.yml 负责补齐
#    （GitHub 不会在 Issue 创建时自动应用 Issue Form 的 labels 字段，这是平台已知行为）。
#
# 2. 【不信任用户输入】申请人 login 只从 github.event.issue.user.login 读取，
#    绝不解析 Issue 正文来「猜」用户名，也绝不接受用户在正文里自报 username。
#
# 3. 【凭据隔离】邀请加入 Organization 需要 Organization 的 Members 写权限，
#    而默认 GITHUB_TOKEN 无法完成组织成员管理（平台限制，不是配置问题）。
#    因此使用外部凭据 secrets.LABA_REPO_ADMIN_TOKEN（fine-grained PAT）。
#    - 该 secret 仅通过 env: 注入，绝不直接拼进 run 脚本字符串，避免表达式注入
#    - 该 secret 绝不写入文件、绝不 echo 到日志
#    - 我们显式 ::add-mask:: 一次，作为对运行日志的额外保护
#
# 4. 【最小权限】GITHUB_TOKEN 只申请 issues: write（发评论/打 label/关闭）与 contents: read。
#    不申请 administration、不申请 pull-requests，Workflow 自身的 token 无法提权。
#    本 workflow 也**不申请** contents: write —— 它从不写代码，只做组织成员管理。
#
# 5. 【防滥用】「邀请加入组织并同步 Team」步骤做幂等检查：已是 organization member /
#    已有 pending 组织邀请 → 不重复发送，直接继续检查 Team 归属；
#    Bot 账号与未勾选确认框一律拒绝。
#    workflow 级 concurrency 保证同一 Issue 不会被并发重复执行。
#
# 6. 【绝不假装成功】凭据权限不足（HTTP 403）会被明确识别为 TOKEN_PERMISSION_INSUFFICIENT，
#    打 failed label 并保持 Issue 开启，绝不伪造成功结果。

name: LABA Auto Invite

on:
  issues:
    types: [opened]

# 同一 Issue 的申请串行化：避免快速重复提交导致并发重复发送邀请。
# cancel-in-progress: false 是有意为之 —— 授权类操作不能被中途取消。
concurrency:
  group: laba-auto-invite-${{ github.event.issue.number }}
  cancel-in-progress: false

# 默认拒绝所有权限，只给下面 job 显式需要的最小权限。
permissions: {}

jobs:
  auto-invite:
    name: 处理 LABA 贡献权限申请
    runs-on: ubuntu-latest

    # ── 前置校验在 job 级别完成 ──────────────────────────────────────────────
    # 只有标题像 LABA 权限申请的 Issue 才值得启动 runner。这里只做最粗的一层过滤，
    # 细粒度校验（Bot 拒绝、body 结构、勾选确认框）交给下面的 validate 步骤，
    # 原因是：Bot 申请也需要进入 job 才能被回复「申请失败」，若在此处拦截会变成静默忽略。
    if: >-
      github.event.issue.pull_request == null &&
      startsWith(github.event.issue.title, '[LABA Access]')

    permissions:
      contents: read   # 只是为了满足 checkout/API 读取的基本需求，本 workflow 实际不需要写代码
      issues: write    # 发评论、打 label、关闭 Issue

    steps:
      # ── 1. 严格校验：确认这确实是一份合法的 LABA 权限申请 ────────────────────
      - name: 校验申请合法性
        id: validate
        env:
          # 注意：这里传入的是不可信用户输入。只做只读校验，绝不拼接进 shell 命令。
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          APPLICANT: ${{ github.event.issue.user.login }}
          APPLICANT_TYPE: ${{ github.event.issue.user.type }}
        run: |
          set -euo pipefail

          echo "申请人 login: $APPLICANT"
          echo "申请人类型: $APPLICANT_TYPE"

          # --- 校验 1：标题前缀 ---
          if [[ "$ISSUE_TITLE" != "[LABA Access]"* ]]; then
            echo "::notice::标题不以 [LABA Access] 开头，跳过处理。"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- 校验 2：Bot 账号默认拒绝 ---
          # 防御以 ... [bot] 结尾的应用账号（user.type 有时为 'User' 的边界情况）。
          if [[ "$APPLICANT_TYPE" == "Bot" || "$APPLICANT" == *"[bot]" ]]; then
            echo "::warning::申请由 Bot 账号 ($APPLICANT) 提交，按防滥用策略拒绝。"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            echo "reject_reason=bot" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- 校验 3：body 必须来自 Issue Form ---
          # Issue Form 渲染后会产生固定标题，用它区分「真正提交表单」与「手写标题骗权限」。
          if [[ "$ISSUE_BODY" != *"申请确认"* ]]; then
            echo "::notice::Issue 正文不含表单固定结构，疑似手写 Issue，跳过。"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # --- 校验 4：必须已勾选确认框 ---
          # Issue Form 的 checkbox 提交后在正文中渲染为 markdown 任务列表：
          #   勾选 -> "- [X]" / "- [x]"；未勾选 -> "- [ ]"
          #
          # 为什么需要下面这两道判断，而不是简单 grep 一行 "- [x]"：
          # 有人可以用 REST API 直接构造 Issue，绕过表单的 required 约束，
          # 并在正文里塞入伪造的 "- [X] 假确认" 来蒙混过关。
          # 表单字段本身是不可编辑的渲染结果，因此真正的确认框所在小节里
          # 有且仅有 GitHub 渲染出的那 1 个任务项。
          # 只要该小节内出现「多个任务项」或「第一个任务项未勾选」，一律视为不合法。
          CONFIRM_BLOCK="$(awk '/^#+[[:space:]]*申请确认/{found=1} found' <<< "$ISSUE_BODY")"

          # 统计确认小节内的任务列表项总数
          ITEM_COUNT="$(grep -cE '^[[:space:]]*-[[:space:]]*\[[ xX]\]' <<< "$CONFIRM_BLOCK" || true)"
          FIRST_ITEM="$(grep -m1 -E '^[[:space:]]*-[[:space:]]*\[[ xX]\]' <<< "$CONFIRM_BLOCK" || true)"

          if [[ -z "$FIRST_ITEM" || "$ITEM_COUNT" != "1" ]]; then
            echo "::warning::确认小节结构异常（任务项数量=$ITEM_COUNT），拒绝授权。"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            echo "reject_reason=unconfirmed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if grep -qiE '^[[:space:]]*-[[:space:]]*\[x\]' <<< "$FIRST_ITEM"; then
            echo "确认框已勾选，且确认小节结构正常。"
          else
            echo "::warning::申请人未勾选确认框，拒绝授权。"
            echo "should_process=false" >> "$GITHUB_OUTPUT"
            echo "reject_reason=unconfirmed" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_process=true" >> "$GITHUB_OUTPUT"
          echo "::notice::校验通过，准备为 $APPLICANT 处理组织加入申请。"

      # ── 2. 凭据检查：缺 secret 时给出明确报错，而不是静默失败 ────────────────
      - name: 检查管理员凭据是否已配置
        id: creds
        if: steps.validate.outputs.should_process == 'true'
        env:
          ADMIN_TOKEN: ${{ secrets.LABA_REPO_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # 只在本地判断是否为空，绝不打印 token 内容或长度以外的信息。
          if [[ -z "${ADMIN_TOKEN:-}" ]]; then
            echo "::error::未配置 secret LABA_REPO_ADMIN_TOKEN，无法发送组织邀请。"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            # 遮蔽日志中的 token 形态，作为防泄漏的最后一道保险。
            echo "::add-mask::$ADMIN_TOKEN"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 3. 核心逻辑：加入 Organization，再同步 LABA-Members Team 归属 ────────
      #
      # 设计要点（为什么分成「组织」+「Team」两段）：
      # · 权限模型是 Organization → Team → Repository，本 workflow 只管「把人放进来」，
      #   不碰任何仓库级权限配置，因此今后新增项目无需改动本文件。
      # · 组织邀请与 Team 加入是两个独立结果，必须分别上报：
      #   邀请发出但 Team 加入失败时，用户仍会收到组织邀请，
      #   因此评论必须明确告知「已邀请，但 Team 归属待管理员确认」，不能笼统说成功。
      - name: 邀请加入组织并同步 Team
        id: invite
        if: steps.validate.outputs.should_process == 'true' && steps.creds.outputs.configured == 'true'
        uses: actions/github-script@v7
        env:
          # 凭据通过 env 注入，不进入 script 源码字符串。
          ADMIN_TOKEN: ${{ secrets.LABA_REPO_ADMIN_TOKEN }}
          APPLICANT: ${{ github.event.issue.user.login }}
        with:
          # 注意：github-token 用的是 GITHUB_TOKEN，只用于在 Issue 里发评论。
          # 所有组织成员管理类请求在脚本内部用 ADMIN_TOKEN 单独发起。
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // 固定目标：wustLABA 组织 + LABA-Members Team。
            const ORG = 'wustLABA';
            // Team 显示名。GitHub API 的成员关系接口要求用 slug，下面是显示名，
            // 真实 slug 必须先查询、再使用，绝不能直接拿显示名拼 URL。
            const TEAM_NAME = 'LABA-Members';
            const MEMBER_ROLE = 'member';

            const applicant = process.env.APPLICANT;
            // token 从不打印；仅用于构造 Authorization 头。
            const adminToken = process.env.ADMIN_TOKEN;

            // 统一的 API 调用封装：只暴露状态码与业务错误信息，绝不回传请求头。
            async function adminApi(method, path, body) {
              const res = await fetch(`https://api.github.com${path}`, {
                method,
                headers: {
                  'Accept': 'application/vnd.github+json',
                  'Authorization': `Bearer ${adminToken}`,
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'laba-auto-invite',
                  ...(body ? { 'Content-Type': 'application/json' } : {}),
                },
                ...(body ? { body: JSON.stringify(body) } : {}),
              });
              let data = null;
              try { data = await res.json(); } catch { /* 204 无响应体是正常情况 */ }
              return {
                status: res.status,
                ok: res.ok,
                data,
                // 只取 GitHub 给的 message 字段，避免把整个响应（可能含敏感上下文）塞进日志。
                message: data && data.message ? data.message : '',
              };
            }

            const results = { decision: 'unknown', team: 'unknown', detail: '' };

            // 403 一律判定为「凭据权限不足」，与业务失败严格区分：
            // 前者需要管理员调整 Token，后者可能是用户状态或 Team 配置问题。
            function isPermissionDenied(r) {
              return r.status === 403 || /not accessible by|Resource not accessible/i.test(r.message);
            }

            // 解析 LABA-Members 的真实 slug。
            // 为什么必须查询而不能硬编码：GitHub 的成员关系接口只认 slug，
            // 而 slug 由显示名推导后可能被改写（大小写折叠、保留字冲突等），
            // 直接假设 'LABA-Members' 一旦猜错就会 404，且错误现象难以排查。
            async function resolveTeamSlug() {
              for (let page = 1; page <= 10; page++) {
                const res = await adminApi('GET', `/orgs/${ORG}/teams?per_page=100&page=${page}`);
                if (!res.ok) {
                  if (isPermissionDenied(res)) {
                    throw Object.assign(
                      new Error('查询组织 Team 列表被拒绝，Token 缺少 Organization Members 读权限。'),
                      { code: 'TOKEN_PERMISSION_INSUFFICIENT' },
                    );
                  }
                  throw Object.assign(
                    new Error(`查询组织 Team 列表失败: HTTP ${res.status} ${res.message}`),
                    { code: 'invite_failed' },
                  );
                }
                const list = Array.isArray(res.data) ? res.data : [];
                const hit = list.find(
                  (t) => t?.name?.toLowerCase() === TEAM_NAME.toLowerCase()
                       || t?.slug?.toLowerCase() === TEAM_NAME.toLowerCase(),
                );
                if (hit?.slug) return hit.slug;
                if (list.length < 100) break;
              }
              // 找不到 Team 属于配置问题，不是权限问题，单独给出可读原因。
              throw Object.assign(
                new Error(`组织 ${ORG} 中未找到名为 ${TEAM_NAME} 的 Team，请确认 Team 是否存在。`),
                { code: 'TEAM_NOT_FOUND' },
              );
            }

            try {
              // ── 第一段：Organization 成员关系 ────────────────────────────────
              // 该接口对非成员返回 404，因此 404 表示「尚未加入」，属于正常路径。
              const ms = await adminApi('GET', `/orgs/${ORG}/memberships/${applicant}`);

              if (ms.ok && ms.data?.state === 'active') {
                // 情况 A：已经是组织成员，绝不重复邀请。
                results.decision = 'already_member';
                results.detail = '已加入组织';
                console.log('申请人已是组织成员，跳过邀请，继续检查 Team 归属。');
              } else if (ms.ok && ms.data?.state === 'pending') {
                // 情况 B：已有待接受的组织邀请，绝不重复发送。
                results.decision = 'already_invited';
                results.detail = '组织邀请待接受';
                console.log('已存在待接受的组织邀请，不重复发送。');
              } else if (ms.status === 404) {
                // 情况 C：尚未加入，创建组织邀请。
                const created = await adminApi('PUT', `/orgs/${ORG}/memberships/${applicant}`, {
                  role: MEMBER_ROLE,
                });
                // 200 = 已是成员（幂等成功）；201 = 新邀请已创建。
                if (created.status === 200 || created.status === 201) {
                  results.decision = 'organization_invited';
                  results.detail = `HTTP ${created.status}`;
                  console.log(`组织邀请已发送（HTTP ${created.status}）。`);
                } else if (isPermissionDenied(created)) {
                  throw Object.assign(
                    new Error('创建组织邀请被拒绝，Token 缺少 Organization Members 写权限。'),
                    { code: 'TOKEN_PERMISSION_INSUFFICIENT' },
                  );
                } else {
                  throw Object.assign(
                    new Error(`创建组织邀请失败: HTTP ${created.status} ${created.message}`),
                    { code: 'invite_failed' },
                  );
                }
              } else if (isPermissionDenied(ms)) {
                throw Object.assign(
                  new Error('查询组织成员关系被拒绝，Token 缺少 Organization Members 读权限。'),
                  { code: 'TOKEN_PERMISSION_INSUFFICIENT' },
                );
              } else {
                throw Object.assign(
                  new Error(`查询组织成员关系失败: HTTP ${ms.status} ${ms.message}`),
                  { code: 'invite_failed' },
                );
              }

              // ── 第二段：LABA-Members Team 归属 ───────────────────────────────
              // 无论组织侧是「新邀请」「已有邀请」还是「已是成员」都继续执行：
              // · 已是成员 → 补齐可能缺失的 Team 归属（这正是幂等的关键）；
              // · 已有邀请 / 新邀请 → 先把 Team 归属准备好，用户接受邀请后即刻生效。
              const slug = await resolveTeamSlug();
              console.log(`已解析 Team slug: ${slug}`);

              const tm = await adminApi(
                'PUT',
                `/orgs/${ORG}/teams/${encodeURIComponent(slug)}/memberships/${applicant}`,
                { role: MEMBER_ROLE },
              );
              // 200 = 加入成功（重复调用同样返回 200，天然幂等）。
              if (tm.ok && tm.status === 200) {
                results.team = 'team_joined';
                console.log('Team 成员关系已同步。');
              } else if (isPermissionDenied(tm)) {
                throw Object.assign(
                  new Error('同步 Team 成员关系被拒绝，Token 缺少 Organization Members 写权限。'),
                  { code: 'TOKEN_PERMISSION_INSUFFICIENT' },
                );
              } else {
                throw Object.assign(
                  new Error(`加入 Team 失败: HTTP ${tm.status} ${tm.message}`),
                  { code: 'team_failed' },
                );
              }
            } catch (err) {
              // 记录技术原因（不含 token/请求头），供管理员排障。
              core.error(`授权流程异常[${err.code || 'unknown'}]: ${err.message}`);
              results.decision = err.code || 'failed';
              results.detail = err.message;
              results.team = 'not_applied';
            }

            core.setOutput('decision', results.decision);
            core.setOutput('detail', results.detail);
            core.setOutput('team', results.team);

      # ── 4. 按结果在 Issue 中回复 ─────────────────────────────────────────────
      - name: 在 Issue 中回复处理结果
        id: comment
        if: steps.validate.outputs.should_process == 'true'
        uses: actions/github-script@v7
        env:
          DECISION: ${{ steps.invite.outputs.decision }}
          DETAIL: ${{ steps.invite.outputs.detail }}
          TEAM_RESULT: ${{ steps.invite.outputs.team }}
          CREDS_OK: ${{ steps.creds.outputs.configured }}
          APPLICANT: ${{ github.event.issue.user.login }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const decision = process.env.DECISION || '';
            const team = process.env.TEAM_RESULT || '';
            const applicant = process.env.APPLICANT;

            // 组织邀请成功后需要用户操作的统一指引。文案集中在此，便于后续统一修改。
            const NEXT_STEPS =
              `下一步：\n\n` +
              `1. 打开 **GitHub Notifications**（右上角铃铛 🔔）\n` +
              `2. 接受 **wustLABA Organization** 邀请\n` +
              `3. 邀请接受后你即成为 **LABA-Members** 团队成员\n` +
              `4. 之后即可参与 LABA 公开项目开发\n\n` +
              `接受邀请后即可 Clone 仓库：\n\n` +
              `\`\`\`bash\n` +
              `git clone https://github.com/wustLABA/first-contributions.git\n` +
              `\`\`\``;

            // 统一按 LABA 规定的话术回复。
            // 注意：绝不出现 Token、Secret、API 路径、权限细节等内部信息。
            const MESSAGES = {
              // 组织邀请已发出 + Team 已同步 —— 完整成功
              organization_invited_team_ok:
                `@${applicant} 你的 LABA GitHub Organization 加入申请已处理。\n\n` +
                `已向你发送 **wustLABA** 组织邀请，并已将你加入 **LABA-Members** 团队。\n\n` +
                NEXT_STEPS,
              // 已是组织成员 + Team 已同步 —— 幂等成功
              already_member_team_ok:
                `@${applicant} 你已经是 **wustLABA** 组织成员，无需重复申请。\n\n` +
                `你已处于 **LABA-Members** 团队中，可以直接参与项目开发。`,
              // 组织邀请已存在（待接受）+ Team 已同步
              already_invited_team_ok:
                `@${applicant} 你的 LABA GitHub Organization 加入申请已处理。\n\n` +
                `你有一条**待接受**的 **wustLABA** 组织邀请（不会重复发送），` +
                `并且已将你加入 **LABA-Members** 团队。\n\n` +
                NEXT_STEPS,
              // 组织邀请已发出，但 Team 同步失败 —— 半成功，必须如实说明
              organization_invited_team_pending:
                `@${applicant} 你的 LABA GitHub Organization 加入申请已处理。\n\n` +
                `已向你发送 **wustLABA** 组织邀请。\n\n` +
                `团队归属的自动同步尚未完成，管理员会尽快为你处理，` +
                `你不必重复提交申请。\n\n` +
                NEXT_STEPS,
              already_member_team_pending:
                `@${applicant} 你已经是 **wustLABA** 组织成员。\n\n` +
                `团队归属的自动同步尚未完成，管理员会尽快为你处理，` +
                `你不必重复提交申请。`,
              already_invited_team_pending:
                `@${applicant} 你有一条**待接受**的 **wustLABA** 组织邀请（不会重复发送）。\n\n` +
                `接受邀请后若仍未进入团队，管理员会为你处理，你不必重复提交申请。\n\n` +
                NEXT_STEPS,
              // 凭据权限不足 —— 必须明确告知是管理员侧问题，用户无需重试
              TOKEN_PERMISSION_INSUFFICIENT:
                `@${applicant} 自动加入流程暂时失败（管理员凭据权限不足）。\n\n` +
                `这与你无关，**不需要**重复提交申请。\n\n` +
                `请联系 LABA 管理员处理。`,
              // Team 不存在等其他配置问题
              TEAM_NOT_FOUND:
                `@${applicant} 自动加入流程暂时失败（团队配置异常）。\n\n` +
                `这与你无关，**不需要**重复提交申请。\n\n` +
                `请联系 LABA 管理员处理。`,
              invite_failed:
                `@${applicant} 自动加入流程暂时失败。\n\n请联系 LABA 管理员处理。`,
              team_failed:
                `@${applicant} 已向你发送 **wustLABA** 组织邀请，但团队归属同步失败。\n\n` +
                `请联系 LABA 管理员处理，不必重复提交申请。`,
            };

            const FAILED = ['TOKEN_PERMISSION_INSUFFICIENT', 'TEAM_NOT_FOUND', 'invite_failed', 'team_failed'];

            // 先判定失败分支，再按「组织结果 + Team 结果」组合出具体话术。
            let key;
            if (FAILED.includes(decision) || !decision || decision === 'unknown') {
              key = FAILED.includes(decision) ? decision : 'invite_failed';
            } else {
              key = `${decision}_${team === 'team_joined' ? 'team_ok' : 'team_pending'}`;
            }

            const body = MESSAGES[key] || MESSAGES.invite_failed;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            // 只有组织侧成功、且 Team 也确实同步完成，才算完整成功。
            core.setOutput('body_kind',
              (FAILED.includes(decision) || !decision || decision === 'unknown') ? 'failed' : key);

      # ── 5. 打标签 + 按需关闭 Issue ───────────────────────────────────────────
      - name: 打标签并关闭 Issue
        if: steps.validate.outputs.should_process == 'true' && steps.comment.outputs.body_kind != ''
        uses: actions/github-script@v7
        env:
          DECISION: ${{ steps.invite.outputs.decision }}
          TEAM_RESULT: ${{ steps.invite.outputs.team }}
          CREDS_OK: ${{ steps.creds.outputs.configured }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const decision = process.env.DECISION || '';
            const team = process.env.TEAM_RESULT || '';
            const credsOk = process.env.CREDS_OK === 'true';

            // 只有「组织侧已处理」且「Team 已同步」才算成功；其余一律按失败处理。
            // 凭据未配置时 decision 为空，同样归入失败分支，保证绝不静默失败。
            // 本 workflow 不存在任何仓库级授权路径，因此判定条件只有组织与 Team 两项。
            const ORG_OK = ['organization_invited', 'already_invited', 'already_member'];
            const success = credsOk && ORG_OK.includes(decision) && team === 'team_joined';

            const addLabel = success ? 'laba-access-approved' : 'laba-access-failed';

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [addLabel],
            });

            if (success) {
              // 成功路径：评论 → 打 approved 标签 → 关闭 Issue
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              console.log(`处理成功，已添加 ${addLabel} 并关闭 Issue。`);
            } else {
              // 失败路径：保持开启，方便管理员人工接手。
              // 这里包含「组织邀请已发出但 Team 未同步」的半成功情况 —— 必须保持开启，
              // 否则管理员会失去这条待跟进的记录。
              console.log(`处理未完整完成（组织=${decision}, Team=${team}），已添加 ${addLabel}，Issue 保持开启。`);
            }

      # ── 6. 被拒绝申请的兜底回复（绝不授予任何权限）───────────────────────────
      # 覆盖两种情况：
      #   · bot      —— Bot 账号默认拒绝（防滥用第 4 条）
      #   · unconfirmed —— 未勾选必填确认框（防滥用第 2 条）
      # 设计上都必须给出明确回复而非静默失败，并打 failed 标签、保持 Issue 开启。
      - name: 回复被拒绝的申请
        if: |
          steps.validate.outputs.reject_reason == 'bot' ||
          steps.validate.outputs.reject_reason == 'unconfirmed'
        uses: actions/github-script@v7
        env:
          REJECT_REASON: ${{ steps.validate.outputs.reject_reason }}
          APPLICANT: ${{ github.event.issue.user.login }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const reason = process.env.REJECT_REASON;
            const applicant = process.env.APPLICANT;

            // 对外统一使用失败话术，不暴露内部判定细节（避免给探测者反馈信号）。
            // 具体原因仅记录在 Actions 日志中，供管理员排查。
            const internal = reason === 'bot'
              ? `申请账号 ${applicant} 被识别为 Bot 账号，按防滥用策略拒绝。`
              : `申请账号 ${applicant} 未勾选必填确认框，拒绝授权。`;
            console.log(internal);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `@${applicant} 自动加入流程暂时失败。\n\n请联系 LABA 管理员处理。`,
            });

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['laba-access-failed'],
            });
